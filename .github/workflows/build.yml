Drafting the ultimate build.yml:

yaml
name: Build SNES ROM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Download PVSnesLib
        run: |
          wget https://github.com/alekmaul/pvsneslib/releases/download/3.4.0/pvsneslib_340_linux.tar.gz
          tar -xzf pvsneslib_340_linux.tar.gz

      - name: Create Source Files
        run: |
          cat << 'EOF' > main.c
          #include <snes.h>
          int main(void) {
              u16 pad;
              u16 x = 128, y = 112;
              consoleInit();
              setMode(BG_MODE1, 0);
              bgSetDisable(1);
              bgSetDisable(2);
              setPaletteColor(0, RGB5(0, 15, 0));
              setScreenOn();
              while(1) {
                  pad = padsCurrent(0);
                  if(pad & KEY_LEFT)  x--;
                  if(pad & KEY_RIGHT) x++;
                  if(pad & KEY_UP)    y--;
                  if(pad & KEY_DOWN)  y++;
                  WaitForVBlank();
                  oamSet(0, x, y, 3, 0, 0, 0, 0);
                  oamSet(1, x+8, y, 3, 0, 1, 0, 0);
                  oamSet(2, x, y+8, 3, 0, 2, 0, 0);
                  oamSet(3, x+8, y+8, 3, 0, 3, 0, 0);
                  oamUpdate();
              }
              return 0;
          }
          EOF

          cat << 'EOF' > Makefile
          ifeq ($(strip $(PVSNESLIB_HOME)),)
          $(error "Please create an environment variable PVSNESLIB_HOME")
          endif
          include ${PVSNESLIB_HOME}/devkitsnes/snes_rules
          ROMNAME = pvz
          CFILES = main.c
          OBJFILES = $(CFILES:.c=.o)
          all: $(ROMNAME).sfc
          EOF

          echo "" > data.asm

      - name: Compile ROM
        run: |
          export PVSNESLIB_HOME=$(pwd)/pvsneslib
          make

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: pvz-snes-rom
          path: "*.sfc"
