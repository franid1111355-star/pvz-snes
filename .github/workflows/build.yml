name: Build SNES ROM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Download PVSnesLib
        run: |
          wget https://github.com/alekmaul/pvsneslib/releases/download/3.4.0/pvsneslib_340_linux.tar.gz
          tar -xzf pvsneslib_340_linux.tar.gz

      - name: Compile ROM
        run: |
          export PVSNESLIB_HOME=$(pwd)/pvsneslib
          make

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: pvz-snes-rom
          path: "*.sfc"
