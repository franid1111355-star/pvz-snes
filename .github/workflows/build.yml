name: Build SNES ROM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y wget unzip
        
      - name: Download PVSnesLib
        run: |
          wget https://github.com/alekmaul/pvsneslib/releases/download/4.6.0/pvsneslib_460_64b_linux_release.zip
          unzip pvsneslib_460_64b_linux_release.zip
          
      - name: Generate Game Files Automatically
        run: |
          cat << 'EOF' > main.c
          #include <snes.h>
          #include <stdlib.h>

          #define LANES 3
          #define COLS 8
          #define MAX_ZOMBIES 15
          #define MAX_PEAS 10

          #define CELL_W 32
          #define CELL_H 48
          #define LAWN_Y 40

          typedef struct { u8 type; u8 hp; } Plant;
          typedef struct { u8 active; u8 lane; s16 x; u8 hp; } Zombie;
          typedef struct { u8 active; u8 lane; s16 x; } Pea;

          Plant grid[LANES][COLS];
          Zombie zombies[MAX_ZOMBIES];
          Pea peas[MAX_PEAS];

          u16 sun = 100;
          u8 cursorLane = 1;
          u8 cursorCol = 0;
          u16 spawnTimer = 0;

          // FIX: Define graphics globally so they are stored in ROM
          const u8 box_tiles[128] = {
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF
          };

          const u8 dummy_pal[32] = {
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00
          };

          int main(void) {
              u16 pad;
              int i, p, l, c;
              u16 sprCount;

              consoleInit();
              setMode(BG_MODE1, 0);
              bgSetDisable(1); bgSetDisable(2);
              
              // Dark Green Background
              setPaletteColor(0, RGB5(0, 8, 0)); 
              // White Text
              setPaletteColor(1, RGB5(31, 31, 31)); 

              consoleDrawText(1, 1, "SUN: 100");

              // FIX: Set Color 15 for all sprite palettes (since we use 0xFF for the tiles)
              setPaletteColor(128 + 15, RGB5(31, 31, 31));       // Palette 0 (Cursor): White
              setPaletteColor(128 + 16 + 15, RGB5(31, 0, 0));    // Palette 1 (Plants): Red
              setPaletteColor(128 + 32 + 15, RGB5(0, 0, 31));    // Palette 2 (Zombies): Blue
              setPaletteColor(128 + 48 + 15, RGB5(31, 31, 0));   // Palette 3 (Peas): Yellow

              // Load graphics safely at 0x4000
              oamInitGfxSet(box_tiles, 128, dummy_pal, 16, 0, 0x4000, OBJ_SIZE16_L32);

              for(l=0; l<LANES; l++) {
                  for(c=0; c<COLS; c++) { grid[l][c].type = 0; }
              }
              for(i=0; i<MAX_ZOMBIES; i++) { zombies[i].active = 0; }
              for(p=0; p<MAX_PEAS; p++) { peas[p].active = 0; }

              setScreenOn();

              while(1) {
                  pad = padsCurrent(0);

                  if((pad & KEY_LEFT) && cursorCol > 0) { cursorCol--; }
                  if((pad & KEY_RIGHT) && cursorCol < COLS-1) { cursorCol++; }
                  if((pad & KEY_UP) && cursorLane > 0) { cursorLane--; }
                  if((pad & KEY_DOWN) && cursorLane < LANES-1) { cursorLane++; }

                  if(pad & KEY_A) {
                      if(grid[cursorLane][cursorCol].type == 0 && sun >= 25) {
                          grid[cursorLane][cursorCol].type = 1;
                          grid[cursorLane][cursorCol].hp = 100;
                          sun -= 25;
                      }
                  }

                  spawnTimer++;
                  if(spawnTimer > 180) {
                      spawnTimer = 0;
                      for(i=0; i<MAX_ZOMBIES; i++) {
                          if(!zombies[i].active) {
                              zombies[i].active = 1;
                              zombies[i].lane = rand() % LANES;
                              zombies[i].x = 240;
                              zombies[i].hp = 100;
                              break;
                          }
                      }
                  }

                  for(l=0; l<LANES; l++) {
                      for(c=0; c<COLS; c++) {
                          if(grid[l][c].type == 1) {
                              u8 hasZombie = 0;
                              for(i=0; i<MAX_ZOMBIES; i++) {
                                  if(zombies[i].active && zombies[i].lane == l && zombies[i].x > (c * CELL_W)) { 
                                      hasZombie = 1; break; 
                                  }
                              }
                              if(hasZombie && (rand() % 40 == 0)) {
                                  for(p=0; p<MAX_PEAS; p++) {
                                      if(!peas[p].active) {
                                          peas[p].active = 1;
                                          peas[p].lane = l;
                                          peas[p].x = (c * CELL_W) + 16;
                                          break;
                                      }
                                  }
                              }
                          }
                      }
                  }

                  for(i=0; i<MAX_ZOMBIES; i++) {
                      if(zombies[i].active) {
                          zombies[i].x -= 1;
                          if(zombies[i].x < -16) zombies[i].active = 0;
                      }
                  }

                  for(p=0; p<MAX_PEAS; p++) {
                      if(peas[p].active) {
                          peas[p].x += 3;
                          if(peas[p].x > 256) peas[p].active = 0;

                          for(i=0; i<MAX_ZOMBIES; i++) {
                              if(zombies[i].active && zombies[i].lane == peas[p].lane) {
                                  if(peas[p].x > zombies[i].x && peas[p].x < zombies[i].x + 16) {
                                      peas[p].active = 0;
                                      zombies[i].hp -= 25;
                                      if(zombies[i].hp <= 0) { zombies[i].active = 0; }
                                  }
                              }
                          }
                      }
                  }

                  WaitForVBlank();
                  sprCount = 0;

                  for(l=0; l<LANES; l++) {
                      for(c=0; c<COLS; c++) {
                          if(grid[l][c].type == 1) {
                              oamSet(sprCount++, c*CELL_W, LAWN_Y + (l*CELL_H), 3, 1, 0, 0, 0);
                          }
                      }
                  }

                  for(i=0; i<MAX_ZOMBIES; i++) {
                      if(zombies[i].active) {
                          oamSet(sprCount++, zombies[i].x, LAWN_Y + (zombies[i].lane*CELL_H), 3, 2, 0, 0, 0);
                      }
                  }

                  for(p=0; p<MAX_PEAS; p++) {
                      if(peas[p].active) {
                          oamSet(sprCount++, peas[p].x, LAWN_Y + (peas[p].lane*CELL_H) + 16, 3, 3, 0, 0, 0);
                      }
                  }

                  oamSet(sprCount++, cursorCol*CELL_W, LAWN_Y + (cursorLane*CELL_H), 3, 0, 0, 0, 0);

                  oamUpdate();
              }
              return 0;
          }
          EOF
          
          cat << 'EOF' > hdr.asm
          .MEMORYMAP
          DEFAULTSLOT 0
          SLOTSIZE $8000
          SLOT 0 $8000
          .ENDME
          .ROMBANKSIZE $8000
          .ROMBANKS 1
          EOF
          
          cat << 'EOF' > data.asm
          .include "hdr.asm"
          .section ".dummy" superfree
          .ends
          EOF
          
          cat << 'EOF' > Makefile
          ifeq ($(strip $(PVSNESLIB_HOME)),)
          $(error "PVSNESLIB_HOME is not set")
          endif

          ROMNAME = pvz

          include ${PVSNESLIB_HOME}/devkitsnes/snes_rules

          CFILES = main.c
          OBJFILES = $(CFILES:.c=.o)

          all: $(ROMNAME).sfc
          EOF
          
      - name: Compile ROM
        run: |
          export PVSNESLIB_HOME=$(pwd)/pvsneslib
          make
          
      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: pvz-snes-rom
          path: "*.sfc"
          if-no-files-found: error
